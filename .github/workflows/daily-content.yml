name: Weekly Content

on:
  schedule:
    - cron: "30 8 * * 4" # Off-peak: ~2:30am Denver daylight (MDT), ~1:30am standard (MST). Low model latency plus fewer rate limit failures. Thursday drop still reviews same morning.
  workflow_dispatch:

concurrency:
  group: weekly-content
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set git identity
        run: |
          git config user.name "ceo-substack-bot"
          git config user.email "ceo-substack-bot@users.noreply.github.com"

      - name: Get run date
        id: rundate
        run: echo "today=$(date +%F)" >> "$GITHUB_OUTPUT"

      - name: Install image renderer
        run: pip install --quiet Pillow

      - name: Run OpenCode content team
        uses: anomalyco/opencode/github@latest
        env:
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: google/gemini-3.5-flash-lite
          use_github_token: true
          prompt: |
            Solo run in this repo, ONE session, never delegate, Task tool is disabled.
            Date for this run: ${{ steps.rundate.outputs.today }}. Use folder drafts/${{ steps.rundate.outputs.today }}.
            Follow prompts/orchestrate.md exactly, all phases inline: research, ideate, article, 5 buyer notes, visual set with rotation, outreach drafts, platform brief, gate plus meta.
            Output is 14 content files plus meta.json: article-draft.md, note-1.md through note-5.md, comic-pack.md, cover.svg, cover.png, image-prompt-pack.md, video-script-pack.md, dm-pack.md, research-brief.md, platform-brief.md.
            Brand lock: Protest Guerrilla headlines only. Carter One and The Last Shuriken are banned. Black #000000, navy #0A0328, purple #7D12FF.
            Proven prompt locks (every image plus video prompt must carry all of these): original high contrast black and white noir illustration, hand drawn ink style, never photorealistic, never name Sin City or any franchise. Hero faceless by design, back to camera, no hat. Ally late 50s vibrant, gold on one small accent only. People grayscale, purple only as thin edge glow on lining seams. No cigarettes, cigars, pipes, vapes, alcohol, drugs, gambling, or any vice. Zero words, letters, or numbers in any scene. Video is ONE 10 second single scene max, end card built in layout.
            Quality gate: score research, article, and every prompt 1 to 5. Rewrite anything below 3 once within the run, then ship the best and name remaining gaps in meta.json. Quality beats speed; use the full timeout.
            Never edit .opencode, skills, prompts, opencode.json, or workflow files. Recommend changes in platform-brief.md only.
            Never push secrets. Work on the checked-out files; do not push directly. Partial files beat no files.

      # Note: no separate PR step. The opencode CLI pushes branch
      # opencode/dispatch-* and opens the review PR itself on every run.
      # A backup PR step was removed after it turned green runs red.
